- name: ngix
  hosts: localhost
  vars_files:
    - secret.yml
    - vars/external_vars.yml
  gather_facts: yes
  tasks:
    - name: Install docker library via pip
      ansible.builtin.pip:
        name: pip2pi
        state: present

    - name: pip download
      ansible.builtin.command:
        cmd: "pip download {{item}} -d {{ex_rpm_root}}/{{item | lower}}"
      register: download_result
      changed_when: "'Saved' in download_result.stdout"
      loop:
        - numpy
