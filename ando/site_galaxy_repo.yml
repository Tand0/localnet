- name: galaxy
  hosts: localhost
  vars_files:
    - secret.yml
    - vars/external_vars.yml
  gather_facts: yes
  tasks:
    - name: download
      ansible.builtin.command:
        cmd: "ansible-galaxy collection download {{item}} -p {{ex_galaxy_root}}"
      register: download_result
      # changed_when: "'Saved' in download_result.stdout"
      loop:
        - cisco.ios
      become: yes
