- name: ngix
  hosts: localhost
  vars_files:
    - secret.yml
    - vars/external_vars.yml
  environment:
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
  gather_facts: yes
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        name:
         - nginx
        state: present
      become: yes
      become_method: sudo
      become_user: root

    - name: Create base directory
      ansible.builtin.file:
        path: "{{item}}"
        state: directory
        mode: '0755'
      loop:
        - "{{ex_root_repo}}"
        - "{{ex_tftp_root}}"
        - "{{ex_galaxy_root}}"
        - "{{ex_pip_root}}"
        - "{{ex_galaxy_root}}"
        - "{{ex_rpm_root}}"
      become: true

    - name: Build parent directory list
      shell: |
        p=$(readlink -f "{{ ex_tftp_root }}")
        while [ "$p" != "/" ]; do
          p=$(dirname "$p")
          echo "$p"
        done
      register: parent_dirs_raw

    - name: Convert to list
      set_fact:
        parent_dirs: "{{ parent_dirs_raw.stdout_lines }}"

    - name: chmod o+rx for all parent directories
      shell: |
        chmod o+rx "{{ item }}"
      loop: "{{ parent_dirs }}"
      args:
        executable: /bin/bash
      become: yes

    - name: Enable the default site configuration by creating a symlink
      ansible.builtin.file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link
      become: yes
  
    - name: Create a sample index.html
      ansible.builtin.copy:
        content: "<h1>Hello from Ansible Nginx!</h1>"
        dest: "{{ex_root_repo}}/index.html"
        mode: '0755'
      become: yes

    - name: Create a sample index.html
      ansible.builtin.copy:
        content: |
          server {
              listen 80;
              server_name {{ex_root_server}};
              root {{ex_root_repo}};
              index index.html;
              location / {
                  autoindex on;
                  try_files $uri $uri/ =404;
              }
          }
        dest: /etc/nginx/sites-available/default
        mode: '0755'
      become: yes

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: yes

