- name: ngix
  hosts: localhost
  vars_files:
    - secret.yml
    - vars/external_vars.yml
  gather_facts: yes
  tasks:
    - name: Update apt 
      ansible.builtin.apt:
        name:
         - createrepo-c
        state: present
        update_cache: yes
      become: yes

    - ansible.builtin.command: "createrepo_c {{ex_rpm_root}}"
      become: yes


